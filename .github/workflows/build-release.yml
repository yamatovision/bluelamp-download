name: build-release
# bluelamp-installer(private) の main から BlueLampSetup.exe をビルドし、
# このリポジトリの Release として公開する。
# 恒久URL: https://github.com/yamatovision/bluelamp-download/releases/latest/download/BlueLampSetup.exe
#
# トリガー:
#   - workflow_dispatch: 手動リリース（gh workflow run build-release -R yamatovision/bluelamp-download）
#   - schedule: 毎日 06:17 JST に main の更新を検知し、未リリースの commit があれば自動リリース
# 認証: read-only deploy key（installer リポの閲覧のみ・Secret INSTALLER_DEPLOY_KEY）。PAT 不使用。
# コード署名: GlobalSign OV コードサイニング証明書（CN=MIKOTO, K.K.）。秘密鍵は GCP Cloud KMS の
#   HSM（FIPS 140-2 Level 3）内にあり、エクスポート不可。CI は Workload Identity 連携で署名だけを依頼する。
#   必要な Secret: GCP_WORKLOAD_IDENTITY_PROVIDER / GCP_SIGNING_SERVICE_ACCOUNT（詳細は codesign/README.md）

on:
  workflow_dispatch:
  schedule:
    - cron: '17 21 * * *'

permissions:
  contents: write
  id-token: write   # Google Cloud への Workload Identity 連携に必要（コード署名）

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha7: ${{ steps.decide.outputs.sha7 }}
      build_needed: ${{ steps.decide.outputs.build_needed }}
    steps:
      - name: Checkout installer main (read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: yamatovision/bluelamp-installer
          ref: main
          ssh-key: ${{ secrets.INSTALLER_DEPLOY_KEY }}
      - name: Decide whether a build is needed
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA7=$(git rev-parse --short=7 HEAD)
          echo "sha7=$SHA7" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
            echo "manual dispatch -> build $SHA7"
          elif gh api "repos/${{ github.repository }}/releases/tags/build-$SHA7" > /dev/null 2>&1; then
            echo "build_needed=false" >> "$GITHUB_OUTPUT"
            echo "release build-$SHA7 already exists -> skip"
          else
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
            echo "new commit $SHA7 -> build"
          fi

  build:
    needs: check
    if: needs.check.outputs.build_needed == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout installer main (read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: yamatovision/bluelamp-installer
          ref: main
          ssh-key: ${{ secrets.INSTALLER_DEPLOY_KEY }}
      - name: Build BlueLampSetup.exe (Inno Setup)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File build/build.ps1

      # ---- ここからコード署名（GlobalSign OV / 秘密鍵は GCP Cloud KMS の HSM 内・外に出ない） ----
      # ⚠️ 署名は必ず SHA256SUMS.txt の生成より前に行う。署名するとファイルのハッシュが変わるため。
      - name: Checkout this repo (証明書チェーンの取得のみ)
        uses: actions/checkout@v4
        with:
          path: _selfrepo
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SIGNING_SERVICE_ACCOUNT }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Set up Java (jsign requires Java 11+)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download jsign (pinned + checksum verified)
        shell: pwsh
        run: |
          $url = 'https://github.com/ebourg/jsign/releases/download/7.5/jsign-7.5.jar'
          $expected = '602A51C3545A6DC4FB99BD2EA7152B26D1345916D0C93DDFBD5936CB735AF91C'
          Invoke-WebRequest -Uri $url -OutFile jsign.jar
          $actual = (Get-FileHash jsign.jar -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "jsign.jar checksum mismatch: $actual" }
      - name: Sign BlueLampSetup.exe (GlobalSign OV / Cloud KMS HSM)
        shell: pwsh
        run: |
          $token = gcloud auth print-access-token
          if (-not $token) { throw "failed to obtain GCP access token" }
          java -jar jsign.jar `
            --storetype GOOGLECLOUD `
            --keystore projects/yamatovision-blue-lamp/locations/asia-northeast1/keyRings/bluelamp-codesign `
            --storepass $token `
            --alias ov-codesign-2026/cryptoKeyVersions/1 `
            --certfile _selfrepo/codesign/full-chain.pem `
            --tsaurl http://timestamp.globalsign.com/tsa/r6advanced1 `
            --tsmode RFC3161 `
            --alg SHA-256 `
            --name "BlueLamp" `
            --url "https://github.com/yamatovision/bluelamp-download" `
            Output/BlueLampSetup.exe
          if ($LASTEXITCODE -ne 0) { throw "jsign failed" }
      - name: Verify signature (発行元が株式会社命であること)
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature Output/BlueLampSetup.exe
          $sig | Format-List Status, StatusMessage, SignerCertificate, TimeStamperCertificate
          if ($sig.Status -ne 'Valid') { throw "signature status is $($sig.Status)" }
          if ($sig.SignerCertificate.Subject -notmatch 'MIKOTO') { throw "unexpected signer: $($sig.SignerCertificate.Subject)" }
          if (-not $sig.TimeStamperCertificate) { throw "signature is not timestamped" }
          "| 項目 | 値 |`n|---|---|`n| 署名 | $($sig.Status) |`n| 発行元 | $($sig.SignerCertificate.Subject) |`n| TSA | $($sig.TimeStamperCertificate.Subject) |" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      # ---- コード署名ここまで ----

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $hash = (Get-FileHash Output/BlueLampSetup.exe -Algorithm SHA256).Hash
          "$hash  BlueLampSetup.exe" | Out-File -Encoding ascii Output/SHA256SUMS.txt
          Get-Content Output/SHA256SUMS.txt
      - name: Read AppVersion
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path installer/BlueLampSetup.iss -Pattern '^AppVersion=(.+)$').Matches[0].Groups[1].Value.Trim()
          "version=$v" | Out-File -Append -Encoding ascii $env:GITHUB_OUTPUT
      - name: Publish release (latest)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-${{ needs.check.outputs.sha7 }}"
          gh release delete $tag --repo ${{ github.repository }} --cleanup-tag --yes 2>$null
          gh release create $tag Output/BlueLampSetup.exe Output/SHA256SUMS.txt `
            --repo ${{ github.repository }} `
            --latest `
            --title "BlueLampSetup v${{ steps.ver.outputs.version }} ($tag)" `
            --notes "bluelamp-installer main @ ${{ needs.check.outputs.sha7 }} からの自動ビルド。SHA256 は SHA256SUMS.txt を参照。"
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
