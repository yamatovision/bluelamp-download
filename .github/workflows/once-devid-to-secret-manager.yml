# 🗑 1 回きり（箱 n=4546・mikoto-co-jp/mikoto-monorepo の Bトーク デスクトップ版の Mac 署名）。
#   この repo の GitHub Secret にだけ在る Developer ID Application の p12 とそのパスワードを、
#   GCP の Secret Manager（apple-developer-id-p12・apple-developer-id-p12-password）へ CI の中で書き写す。
#   値は席・転写を通らない（標準入力で gcloud へ渡すだけ・印字しない）。
#   書けるのは bluelamp-codesign SA に一時で付けた secretVersionAdder（この 2 本だけ）。
#   ⛔ 撃ったらこの workflow と一時の権限を消す（n=4546 の席 B が消す）。
name: once-devid-to-secret-manager

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: main からだけ
        env:
          REF: ${{ github.ref }}
        run: |
          [ "$REF" = "refs/heads/main" ] || { echo "::error::main からだけ（いま ${REF}）"; exit 1; }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SIGNING_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: p12 を確かめる（証明書の主体だけ出す・鍵とパスワードは出さない）
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          p12="$RUNNER_TEMP/d.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$p12"
          test -s "$p12"
          subj=$(openssl pkcs12 -legacy -in "$p12" -passin env:APPLE_CERTIFICATE_PASSWORD -nokeys 2>/dev/null \
            | openssl x509 -noout -subject)
          echo "$subj"
          echo "$subj" | grep -q 'Developer ID Application' || { echo "::error::Developer ID Application の証明書ではない"; exit 1; }
          openssl pkcs12 -legacy -in "$p12" -passin env:APPLE_CERTIFICATE_PASSWORD -nocerts -nodes 2>/dev/null | grep -q 'PRIVATE KEY' \
            || { echo "::error::秘密鍵が入っていない"; exit 1; }
          echo "p12 $(stat -c %s "$p12") bytes・sha256 $(sha256sum "$p12" | cut -c1-16)…" >> "$GITHUB_STEP_SUMMARY"
      - name: Secret Manager へ書く（標準入力・印字しない）
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          gcloud secrets versions add apple-developer-id-p12 --project=yamatovision-blue-lamp \
            --data-file="$RUNNER_TEMP/d.p12" --format='value(name)'
          printf '%s' "$APPLE_CERTIFICATE_PASSWORD" | gcloud secrets versions add apple-developer-id-p12-password \
            --project=yamatovision-blue-lamp --data-file=- --format='value(name)'
      - name: 一時ファイルを消す
        if: always()
        run: rm -f "$RUNNER_TEMP/d.p12"
